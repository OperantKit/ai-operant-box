[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ai-operant-box"
dynamic = ["version"]
description = "LLM-as-subject simulator: an LLM or a numerical agent is the organism in a discrete-time three-term-contingency (SD-R-SR) operant chamber."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "OperantKit contributors" }]
keywords = [
    "behavior-analysis",
    "operant-conditioning",
    "reinforcement-schedule",
    "llm",
    "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.39",
]
# Local GGUF models through llama.cpp, for reading action probabilities
# from the logits (ai_operant_box.agent.local_logprob).
local = [
    "llama-cpp-python>=0.3",
]
# Concurrent schedules with a changeover delay come from contingency-py
# (ai_operant_box.chamber.concurrent).
concurrent = [
    "contingency-py>=0.1.1,<0.2",
]
# Cumulative-record rendering delegates to session-analyzer for canonical
# Ferster & Skinner style (Lattal, 2004); scipy backs the FI scallop fit.
viz = [
    "session-analyzer>=0.1.1,<0.2",
    "matplotlib>=3.7",
    "scipy>=1.11",
]
# Canonical OperantKit pipeline: experiment-core / session-recorder for
# OKL v1 mirror of native BehavioralEvent stream
# (see ai_operant_box.async_simulator.canonical_sink).
canonical = [
    "experiment-core>=0.2,<0.3",
    "session-recorder>=0.2,<0.3",
]
test = [
    "pytest>=8",
    "pytest-cov",
    "pytest-asyncio>=0.23",
    "session-analyzer>=0.1.1,<0.2",
    "matplotlib>=3.7",
    "scipy>=1.11",
    "experiment-core>=0.2,<0.3",
    "session-recorder>=0.2,<0.3",
    "contingency-py>=0.1.1,<0.2",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-asyncio>=0.23",
    "session-analyzer>=0.1.1,<0.2",
    "matplotlib>=3.7",
    "scipy>=1.11",
    "experiment-core>=0.2,<0.3",
    "session-recorder>=0.2,<0.3",
    "contingency-py>=0.1.1,<0.2",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
ai-operant-box = "ai_operant_box.cli:main"

[project.urls]
Homepage = "https://github.com/OperantKit"
Repository = "https://github.com/OperantKit/ai-operant-box"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/ai_operant_box/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_operant_box"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "unit: pure-function unit tests",
    "integration: end-to-end / multi-component tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
