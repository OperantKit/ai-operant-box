[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-operant-box"
version = "0.1.0a0"
description = "LLM-as-subject simulator: an LLM agent acts as a participant in a three-term-contingency operant chamber per OperantKit DSL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "operantkit contributors" }]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.39",
]
# Cumulative-record rendering delegates to session-analyzer for canonical
# Ferster & Skinner style (Lattal, 2004). Declared as a local path
# reference so monorepo checkouts can resolve it without a PyPI release.
viz = [
    "session-analyzer @ {root:uri}/../../analysis/session-analyzer",
    "matplotlib>=3.7",
]
# Canonical OperantKit pipeline: experiment-core / session-recorder for
# OKL v1 mirror of native BehavioralEvent stream
# (see ai_operant_box.async_simulator.canonical_sink).
canonical = [
    "experiment-core @ {root:uri}/../../experiment/experiment-core",
    "session-recorder @ {root:uri}/../../experiment/session-recorder",
]
test = [
    "pytest>=8",
    "pytest-cov",
    "pytest-asyncio>=0.23",
    "session-analyzer @ {root:uri}/../../analysis/session-analyzer",
    "matplotlib>=3.7",
    "experiment-core @ {root:uri}/../../experiment/experiment-core",
    "session-recorder @ {root:uri}/../../experiment/session-recorder",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-asyncio>=0.23",
    "session-analyzer @ {root:uri}/../../analysis/session-analyzer",
    "matplotlib>=3.7",
    "experiment-core @ {root:uri}/../../experiment/experiment-core",
    "session-recorder @ {root:uri}/../../experiment/session-recorder",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
ai-operant-box = "ai_operant_box.cli:main"

[tool.hatch.metadata]
# Required to accept PEP 508 direct references (file://) in dependencies.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ai_operant_box"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "unit: pure-function unit tests",
    "integration: end-to-end / multi-component tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
